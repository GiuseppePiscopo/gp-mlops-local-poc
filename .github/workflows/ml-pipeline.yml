name: ML pipeline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Initial model only: require champion absent and apply absolute thresholds"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  train-and-evaluate:
    name: Train and evaluate
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'GiuseppePiscopo')
    runs-on: [self-hosted, Linux, X64, mlops-local]
    timeout-minutes: 30
    outputs:
      run_id: ${{ steps.results.outputs.run_id }}
      model_uri: ${{ steps.results.outputs.model_uri }}
      git_commit: ${{ steps.results.outputs.git_commit }}
      evaluation_mode: ${{ steps.results.outputs.evaluation_mode }}
      evaluation_passed: ${{ steps.results.outputs.evaluation_passed }}
      artifact_name: ${{ steps.results.outputs.artifact_name }}
      registered_model: ${{ steps.results.outputs.registered_model }}
      model_version: ${{ steps.results.outputs.model_version }}
    defaults:
      run:
        shell: bash
    env:
      GIT_REPOSITORY: ${{ github.workspace }}
      BUILD_RESULT: pipeline-build-${{ github.run_id }}-${{ github.run_attempt }}.json
      TRAINING_RESULT: training-${{ github.run_id }}-${{ github.run_attempt }}.json
      TRAINING_SNAPSHOT: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_SET_WORKSPACE: test-set-${{ github.run_id }}-${{ github.run_attempt }}
      EVALUATION_DIRECTORY: evaluation-${{ github.run_id }}-${{ github.run_attempt }}
      RESULTS_DIRECTORY: results-${{ github.run_id }}-${{ github.run_attempt }}
      REGISTRATION_DIRECTORY: registration-${{ github.run_id }}-${{ github.run_attempt }}
      TRAINING_DATA_HOST_PATH: /opt/mlops-local-poc/training/data/input/SeoulBikeData.csv
      DOCKER_NETWORK: mlops-local-network
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: gp-mof-capstone-training
      REGISTERED_MODEL_NAME: gp-mof-capstone-model
      PIPELINE_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap && 'true' || 'false' }}
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Linux checkout and commit
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/verify-checkout.sh" \
            "$GIT_REPOSITORY" "$GITHUB_SHA"

      - name: Build training image from checkout
        run: |
          set -euo pipefail
          unset IMAGE_TAG
          bash "$GIT_REPOSITORY/training/scripts/build-image.sh" > "$RUNNER_TEMP/$BUILD_RESULT"

      - name: Verify image provenance
        run: |
          python3 "$GIT_REPOSITORY/ci-cd/scripts/verify-image-provenance.py" \
            --build-result "$RUNNER_TEMP/$BUILD_RESULT" \
            --expected-commit "$GITHUB_SHA" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Prepare dataset and champion snapshot
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/prepare-training.sh" \
            "$TRAINING_DATA_HOST_PATH" "$RUNNER_TEMP/$TRAINING_SNAPSHOT"

      - name: Train without model registration
        id: training
        run: |
          set -euo pipefail
          unset IMAGE_TAG
          python3 "$GIT_REPOSITORY/training/scripts/run_training.py" \
            --skip-registration \
            --training-data "$RUNNER_TEMP/$TRAINING_SNAPSHOT/SeoulBikeData.csv" \
            --input-snapshot "$RUNNER_TEMP/$TRAINING_SNAPSHOT/snapshot.json" \
            --test-set-directory "$RUNNER_TEMP/$TEST_SET_WORKSPACE/data" \
            --result-json "$RUNNER_TEMP/$TRAINING_RESULT" \
            --n-estimators 100 \
            --max-depth 10

      - name: Evaluate candidate
        id: evaluation
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/evaluate-training.sh" \
            "$RUNNER_TEMP/$TRAINING_RESULT" \
            "$RUNNER_TEMP/$TRAINING_SNAPSHOT/snapshot.json" \
            "$RUNNER_TEMP/$TEST_SET_WORKSPACE/data" \
            "$RUNNER_TEMP/$EVALUATION_DIRECTORY"

      - name: Report training and evaluation
        id: report
        if: ${{ !cancelled() && steps.evaluation.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          python3 "$GIT_REPOSITORY/ci-cd/scripts/report-training-evaluation.py" \
            --result "$RUNNER_TEMP/$TRAINING_RESULT" \
            --evaluation "$RUNNER_TEMP/$EVALUATION_DIRECTORY/report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Register evaluated model as candidate
        id: registration
        if: >-
          success() &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/register-candidate.sh" \
            "$RUNNER_TEMP/$TRAINING_RESULT" \
            "$RUNNER_TEMP/$TRAINING_SNAPSHOT/snapshot.json" \
            "$RUNNER_TEMP/$EVALUATION_DIRECTORY/report.json" \
            "$RUNNER_TEMP/$REGISTRATION_DIRECTORY"

      - name: Export training and evaluation results
        id: results
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        env:
          REGISTRATION_OUTCOME: ${{ steps.registration.outcome }}
        run: |
          REGISTRATION_ARGS=()
          if [[ "$REGISTRATION_OUTCOME" == "success" ]]; then
            REGISTRATION_ARGS+=(--registration "$RUNNER_TEMP/$REGISTRATION_DIRECTORY/registration-result.json")
          fi
          python3 "$GIT_REPOSITORY/ci-cd/scripts/export-training-evaluation.py" \
            --result "$RUNNER_TEMP/$TRAINING_RESULT" \
            --evaluation "$RUNNER_TEMP/$EVALUATION_DIRECTORY/report.json" \
            --expected-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-directory "$RUNNER_TEMP/$RESULTS_DIRECTORY" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${REGISTRATION_ARGS[@]}"

      - name: Upload training and evaluation results
        if: ${{ !cancelled() && steps.results.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.results.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ env.RESULTS_DIRECTORY }}/*.json
          if-no-files-found: error

      - name: Report pipeline scope
        run: |
          printf '%s\n' \
            '## Pipeline scope' \
            '' \
            'Training and evaluation completed. Registration runs only after a successful gate on main/manual runs. Production approval is handled by the dependent job; deployment is not implemented yet.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Clean ephemeral test set
        if: ${{ always() }}
        run: |
          python3 "$GIT_REPOSITORY/ci-cd/scripts/clean-test-set.py" \
            --runner-temp "$RUNNER_TEMP" \
            --workspace "$TEST_SET_WORKSPACE"

  deploy:
    name: Deploy (checks only)
    needs: train-and-evaluate
    if: >-
      success() &&
      needs.train-and-evaluate.outputs.evaluation_passed == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    concurrency:
      group: production-gp-mof-capstone-model
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, Linux, X64, mlops-local]
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    env:
      GIT_REPOSITORY: ${{ github.workspace }}
      DOCKER_NETWORK: mlops-local-network
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_RUN_ID: ${{ needs.train-and-evaluate.outputs.run_id }}
      MODEL_URI: ${{ needs.train-and-evaluate.outputs.model_uri }}
      MODEL_COMMIT: ${{ needs.train-and-evaluate.outputs.git_commit }}
      REGISTERED_MODEL: ${{ needs.train-and-evaluate.outputs.registered_model }}
      MODEL_VERSION: ${{ needs.train-and-evaluate.outputs.model_version }}
      EVALUATION_MODE: ${{ needs.train-and-evaluate.outputs.evaluation_mode }}
    steps:
      - name: Checkout with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Verify Linux checkout and commit
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/verify-checkout.sh" \
            "$GIT_REPOSITORY" "$GITHUB_SHA"

      - name: Check approved model and current champion
        run: |
          bash "$GIT_REPOSITORY/ci-cd/scripts/check-deployment.sh"

      - name: Report approved deployment target
        run: |
          set -euo pipefail
          printf '%s\n' \
            '## Production approval' \
            '' \
            "- Registered model: \`$REGISTERED_MODEL\`" \
            "- Model version: \`$MODEL_VERSION\`" \
            "- Source run: \`$MODEL_RUN_ID\`" \
            "- Model URI: \`$MODEL_URI\`" \
            "- Commit: \`$MODEL_COMMIT\`" \
            '' \
            'Approval and pre-deployment checks completed. Deployment is not implemented yet; no cluster resources or model aliases were changed by this job.' \
            >> "$GITHUB_STEP_SUMMARY"
