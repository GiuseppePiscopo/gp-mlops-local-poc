name: mlops-local

services:
  postgres:
    image: postgres:16.10-bookworm
    container_name: mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - type: bind
        source: ./data/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mlops-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: mlops-seaweedfs
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:${S3_HOST_PORT}:8333"
      - "127.0.0.1:${SEAWEEDFS_MASTER_HOST_PORT}:9333"
      - "127.0.0.1:${SEAWEEDFS_FILER_HOST_PORT}:8888"
    volumes:
      - type: bind
        source: ./data/seaweedfs
        target: /data
      - type: bind
        source: ./object-store
        target: /etc/seaweedfs
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:9333/cluster/status
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mlops-network

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0-full
    container_name: mlops-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      MLFLOW_S3_IGNORE_TLS: "true"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination
      - s3://${S3_BUCKET}
      - --allowed-hosts
      - localhost:*,mlflow:5000
    ports:
      - "127.0.0.1:${MLFLOW_HOST_PORT}:5000"
    networks:
      - mlops-network

networks:
  mlops-network:
    name: mlops-local-network