apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: gp-mof-capstone-mlserver
  namespace: gp-mof-capstone-serving
  annotations:
    serving.kserve.io/server-type: mlserver
spec:
  supportedModelFormats:
    - name: mlflow
      version: "2"
      autoSelect: true
      priority: 1
  protocolVersions:
    - v2
  containers:
    - name: kserve-container
      image: gp-mof-capstone-mlserver:dev
      imagePullPolicy: IfNotPresent
      env:
        - name: MLSERVER_MODEL_IMPLEMENTATION
          value: "logging_runtime.LoggingMLflowRuntime"
        - name: MLSERVER_HTTP_PORT
          value: "8080"
        - name: MLSERVER_GRPC_PORT
          value: "9000"
        - name: MLFLOW_TRACKING_URI
          value: "sqlite:////tmp/mlflow.db"
        - name: MODEL_NAME
          value: "gp-mof-capstone-model"
        - name: MODEL_VERSION
          value: "1"
        - name: LOG_SAMPLE_RATE
          value: "1.0"
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8082
          name: metrics
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 12
      livenessProbe:
        httpGet:
          path: /v2/health/live
          port: 8080
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6